##############################################################################
#
#  VISAO GERAL
#  -----------
#  Constroi um pacote .xbps a partir de um repositorio da organizacao
#  VoidLinuxBR (que tenha pkgfile/PKGFILE) e publica no repositorio VoidBR.
#
#  Lugares envolvidos:
#    - servidor voidbr : onde rodam os runners self-hosted (void-runner-0..10,
#                        servicos runit github-runner*). A pasta
#                        /voidrepo/void-mirror/extra deste servidor E o
#                        repositorio voidbr.
#    - Hostinger       : repo.chililinux.com (organizacao "void" do
#                        chili-make-repo). Recebe o repositorio por rsync/ssh.
#
#  Fluxo:
#    1. o repositorio do pacote (ex: voidbr-lynxfetch) faz push no main e o
#       trigger-package.yml dele dispara um repository_dispatch aqui, com
#       client_payload.repository = "VoidLinuxBR/<pacote>"
#    2. o job sobe o container vcatafesta/voidlinux-docker com a pasta
#       /voidrepo/void-mirror/extra do servidor montada como volume
#    3. pkgmake gera o .xbps direto nessa pasta (= repositorio voidbr)
#    4. reindexa (voidbr-xlocate-index + pkgmake --reindex-only)
#    5. chili-make-repo empurra a pasta para a Hostinger
#    6. notifica cada etapa nos grupos do Telegram
#
#  Disparo manual: Actions -> VoidBR Build Package -> Run workflow,
#  informando o repositorio (ex: VoidLinuxBR/voidbr-lynxfetch).
#
#  Secrets usados:
#    ORGANIZATION_TOKEN            token com acesso aos repositorios da org
#    SSH_PRIVATE_KEY               chave ssh para a Hostinger (rsync)
#    SERVER_HOST/USER/PORT         acesso ssh a Hostinger
#    PKGMAKE_PRIVATE_KEY           chave RSA que assina pacotes e repodata
#    CHILI_SECRETKEY               SECRETKEY do .chili-make-repo.conf
#    VOIDBR_PACKAGES_TOKEN_BOT,
#    CHAT_ID, MESSAGE_THREAD_ID_PACKAGE        bot/grupo Telegram VoidBR Dev
#    VOIDBR_BR_PACKAGES_TOKEN_BOT,
#    VOIDBR_BR_PACKAGES_CHAT_ID,
#    VOIDBR_BR_PACKAGES_MESSAGE_THREAD_ID      bot/grupo Telegram VoidBR BR
#
#  Cuidados:
#    - dentro do container o HOME e /github/home (nao /root): chaves e confs
#      sao criados em /root e copiados para o $HOME
#    - se os builds ficarem em "Waiting for a runner", veja os runners no
#      servidor (sv status /var/service/github-runner*) e o _diag de cada um
#
##############################################################################
name: VoidBR Build Package

# um build por vez: todos escrevem em /voidrepo/void-mirror/extra e
# fazem rsync do mesmo repositorio remoto
concurrency:
  group: voidbr-build-package
  cancel-in-progress: false

on:
  # disparo manual pela aba Actions
  workflow_dispatch:
    inputs:
      tmate:
        type: boolean
        description: "With TMATE"
        required: false
        default: false
      packager:
        type: string
        description: "Empacotador"
        required: true
        default: "Vilmar Catafesta <vcatafesta@gmail.com>"
      repository:
        type: string
        description: "Repositorio para construir"
        required: true
        default: "voidlinuxbr/repo"
  # disparo pelos repositorios de pacote (trigger-package.yml)
  repository_dispatch:
    types:
      - webhook
      - "**"

# variaveis globais; o packager/repositorio vem do client_payload (dispatch)
# ou dos inputs (manual)
env:
  GITHUB_TOKEN: "${{ secrets.ORGANIZATION_TOKEN }}"
  TM_VOIDBR_DEV_1: "${{ secrets.VOIDBR_PACKAGES_TOKEN_BOT }}"
  TM_VOIDBR_DEV_2: "${{ secrets.CHAT_ID }}"
  TM_VOIDBR_DEV_3: "${{ secrets.MESSAGE_THREAD_ID_PACKAGE }}"
  TM_VOIDBR_BR_1: "${{ secrets.VOIDBR_BR_PACKAGES_TOKEN_BOT }}"
  TM_VOIDBR_BR_2: "${{ secrets.VOIDBR_BR_PACKAGES_CHAT_ID }}"
  TM_VOIDBR_BR_3: "${{ secrets.VOIDBR_BR_PACKAGES_MESSAGE_THREAD_ID }}"
  SSH_PRIVATE_KEY: "${{ secrets.SSH_PRIVATE_KEY }}"
  SERVER_HOST: "${{ secrets.SERVER_HOST }}"
  SERVER_USER: "${{ secrets.SERVER_USER }}"
  SERVER_PORT: "${{ secrets.SERVER_PORT }}"
  PKGMAKE_PRIVATE_KEY: "${{ secrets.PKGMAKE_PRIVATE_KEY }}"
  CHILI_SECRETKEY: "${{ secrets.CHILI_SECRETKEY }}"
  PKGMAKE_PACKAGER: "${{ github.event.client_payload.packager || inputs.packager || 'Vilmar Catafesta <vcatafesta@gmail.com>' }}"
  DEBUG: "${{ github.event.client_payload.tmate || inputs.tmate || false }}"
  TARGET_REPOSITORY: "${{ github.event_name == 'workflow_dispatch' && inputs.repository || github.event.client_payload.repository }}"
  ISO_DISTRONAME: "voidbr"
  STARTED_BY_USER: "${{ github.actor }}"
  TRIGGERED_BY_USER: "${{ github.triggering_actor }}"
  FULL_PACKAGE_NAME: ''
  REPO_DIR: /voidrepo/void-mirror/extra

jobs:
  build:
    runs-on: self-hosted
    timeout-minutes: 60
    env:
      TERM: xterm
    container:
      image: vcatafesta/voidlinux-docker:1.5 #seg 16 fev 2026 23:52:08 -04
      options: --privileged
      volumes:
        - /voidrepo/mnt/lfs:/mnt/lfs
        - /voidrepo/void-mirror/extra:/voidrepo/void-mirror/extra
        # cache de pacotes xbps reaproveitado entre builds
        - /voidrepo/xbps-cache:/var/cache/xbps
    steps:
      # cria /tmp/send_telegram_message.sh com msg/replicate/send_telegram_msg,
      # usado pelos steps seguintes via "source"
      - name: Preparar helpers e notificar inicio
        shell: bash
        run: |
          START_TIME=$(date +"%Y-%m-%d %H:%M:%S")
          echo "START_TIME=$START_TIME"           >> "$GITHUB_ENV"
          echo "START_TIMESTAMP=$(date +%s)"      >> "$GITHUB_ENV"
          export START_TIME

          cat << 'EOF' > /tmp/send_telegram_message.sh
          export TERM=${TERM:-xterm}

          export reset="\033[0m"
          export green="\033[01;32m"
          export red="\033[01;31m"
          export blue="\033[01;34m"
          export cyan="\033[01;36m"
          export yellow="\033[01;33m"

          msg() {
            echo -e "BP=>${cyan}running: ${yellow}$(sed 's/<[^>]*>//g' <<< "$1")${reset}"
          }

          replicate() {
            local char=${1:-'#'} nsize=${2:-80} line
            printf -v line "%*s" "$nsize" && echo -e "${blue}${line// /$char}${reset}"
          }

          send_telegram_msg() {
            local link_action="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            local MESSAGE="${GITHUB_WORKFLOW} - $1
          <a href=\"${link_action}\">▶ Job #${GITHUB_RUN_NUMBER}</a>
          <pre>
          Triggered     : ${STARTED_BY_USER}
          Inicio        : ${START_TIME}
          Distroname    : ${ISO_DISTRONAME}
          Release       : ${FULL_PACKAGE_NAME}
          Tmate         : ${DEBUG}
          Package Name  : ${TARGET_REPOSITORY}
          </pre>"

            echo -e "${green}$(sed 's/<[^>]*>//g' <<< "$MESSAGE")${reset}"

            local bot var_token var_chat var_thread token chat thread
            for bot in DEV BR; do
              var_token="TM_VOIDBR_${bot}_1" var_chat="TM_VOIDBR_${bot}_2" var_thread="TM_VOIDBR_${bot}_3"
              token=${!var_token} chat=${!var_chat} thread=${!var_thread}
              [[ -n $token && -n $chat ]] || continue
              curl -s -o /dev/null -w "telegram $bot: %{http_code}\n" \
                -X POST "https://api.telegram.org/bot${token}/sendMessage" \
                -d chat_id="$chat" \
                ${thread:+-d message_thread_id="$thread"} \
                --data-urlencode text="$MESSAGE" \
                -d parse_mode="HTML" || true
            done
          }
          EOF

          source /tmp/send_telegram_message.sh
          send_telegram_msg "🚀 <b>[step 1/3] - Iniciando construcao do pacote $TARGET_REPOSITORY</b>"

      # atualiza xbps/pkgmake e garante o locale pt_BR (o cache do xbps vem
      # do volume /voidrepo/xbps-cache, entao so baixa o que mudou)
      - name: Atualizar ferramentas e locale
        shell: bash
        run: |
          rm -f /etc/xbps.d/0{2..9}-* || true
          xbps-install -Syu xbps || true
          xbps-install -uy void-utils voidbr-pkgmake tmate openssh git glibc-locales shfmt || true

          # so gera o locale se ainda nao existir na imagem
          if ! locale -a 2>/dev/null | grep -qi '^pt_BR\.utf-\?8$'; then
            echo "pt_BR.UTF-8 UTF-8" > /etc/default/libc-locales
            xbps-reconfigure -f glibc-locales || true
          fi
          echo "LANG=pt_BR.UTF-8"     >> "$GITHUB_ENV"
          echo "LANGUAGE=pt_BR.UTF-8" >> "$GITHUB_ENV"

          # o HOME no container e /github/home: leva a config do root (.gnupg etc.)
          cp -Rpa /root/. "$HOME/." || true

      # sessao tmate para depuracao, so quando DEBUG/tmate = true
      - name: Setup TMATE Session in CONTAINER
        uses: mxschmitt/action-tmate@v3
        if: ${{ env.DEBUG == 'true' }}
        with:
          install-dependencies: false
          detached: true

      # cria ~/.ssh (chave rsync da Hostinger + privkey.pem do pkgmake) e o
      # ~/.chili-make-repo.conf, em /root e no $HOME do container
      - name: Configurar chaves e chili-make-repo
        shell: bash
        run: |
          umask 077
          rm -rf /root/.ssh
          mkdir -p /root/.ssh

          {
            echo "Host repo"
            echo "  HostName $SERVER_HOST"
            echo "  Port $SERVER_PORT"
            echo "  User $SERVER_USER"
            echo "  IdentityFile /root/.ssh/id_rsa"
            echo "  UserKnownHostsFile /root/.ssh/known_hosts"
            echo "  IdentitiesOnly yes"
          } > /root/.ssh/config

          echo "$PKGMAKE_PRIVATE_KEY" > /root/.ssh/private.pem
          echo "$PKGMAKE_PRIVATE_KEY" > /root/.ssh/privkey.pem
          printf '%s\n' "$SSH_PRIVATE_KEY" > /root/.ssh/id_rsa
          ssh-keygen -y -f /root/.ssh/id_rsa > /root/.ssh/id_rsa.pub || true
          ssh-keyscan -p "$SERVER_PORT" repo.chililinux.com >> /root/.ssh/known_hosts
          ssh-keyscan -p "$SERVER_PORT" 147.93.38.151 >> /root/.ssh/known_hosts
          chmod 700 /root/.ssh
          chmod 600 /root/.ssh/*

          {
            echo "[void]"
            echo "GPGKEY=A0D5A8312A83940ED8B04B0F4BAC871802E960F1"
            echo "SECRETKEY=$CHILI_SECRETKEY"
            echo "local_PATH=$REPO_DIR"
            echo "remote_HOST=repo.chililinux.com"
            echo "remote_USER=$SERVER_USER"
            echo "remote_PATH=/home/$SERVER_USER/domains/chililinux.com/public_html/void/current"
            echo "remote_PORT=$SERVER_PORT"
            echo "PACKAGER='Vilmar Catafesta <vcatafesta@gmail.com>'"
            echo "prefix_DB=void"
          } > /root/.chili-make-repo.conf

          # no container o HOME e /github/home (pkgmake procura a chave em $HOME/.ssh)
          if [[ "$HOME" != /root ]]; then
            rm -rf "$HOME/.ssh"
            cp -a /root/.ssh "$HOME/.ssh"
            cp -a /root/.chili-make-repo.conf "$HOME/.chili-make-repo.conf"
          fi

      # clona o repositorio do pacote em ./pkgmake
      - name: Checkout do pacote recebido
        uses: actions/checkout@v5
        with:
          repository: ${{ env.TARGET_REPOSITORY }}
          token: ${{ secrets.ORGANIZATION_TOKEN }}
          fetch-depth: 1
          path: pkgmake

      # gera o .xbps em $REPO_DIR; falha se o pkgmake der erro ou se nenhum
      # pacote novo aparecer (evita publicar um pacote antigo por engano)
      - name: Build pkg ${{ env.TARGET_REPOSITORY }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          cd pkgmake/pkgfile
          pkgver=$(date +%Y%m%d)
          pkgrel=$(date +%H%M)
          export pkgver pkgrel

          # marca o momento do inicio do build, para achar so pacotes gerados agora
          marker=$(mktemp)

          # 1) se o pkgmake falhar, para aqui
          if ! pkgmake -s \
            --packager "$PKGMAKE_PACKAGER" \
            --pkgdest "$REPO_DIR"; then
            send_telegram_msg "❌ <b>[step 2/3] - Falha ao construir pacote (pkgmake retornou erro)</b>"
            exit 1
          fi

          # 2) confere se saiu um .xbps NOVO (mais novo que o marker)
          source PKGFILE
          FULL_PACKAGE_NAME=$(find "$REPO_DIR" -maxdepth 1 -type f \
            -name "${pkgname}-*.xbps" -newer "$marker" -printf '%T@ %p\n' \
            | sort -rn | head -n1 | cut -d' ' -f2-)
          export FULL_PACKAGE_NAME

          if [[ -z $FULL_PACKAGE_NAME ]]; then
            send_telegram_msg "❌ <b>[step 2/3] - pkgmake terminou, mas nenhum pacote novo de ${pkgname} foi gerado</b>"
            exit 1
          fi

          echo "FULL_PACKAGE_NAME=$FULL_PACKAGE_NAME" >> "$GITHUB_ENV"
          send_telegram_msg "✅ <b>[step 2/3] - Pacote construido</b>"

      # mesma sequencia usada localmente: indice do xlocate, reindexa o
      # repodata e empurra o repositorio para a Hostinger (organizacao void)
      - name: Sincronizar pacote com repositorio remoto
        shell: bash
        run: |
          cd "$REPO_DIR"

          # indice do xlocate (nao bloqueia a publicacao se falhar)
          if command -v voidbr-xlocate-index >/dev/null; then
            voidbr-xlocate-index || echo "::warning::voidbr-xlocate-index falhou"
          else
            echo "::warning::voidbr-xlocate-index nao encontrado no container"
          fi

          # reindexa o repodata local antes de enviar
          pkgmake --reindex-only --pkgdest "$REPO_DIR"

          chili-make-repo --verbose --organization void --sync-remote-with-local

      # mensagens finais no Telegram
      - name: Notificar sucesso
        if: ${{ success() }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          send_telegram_msg "✅ <b>[step 3/3] - Build finalizado com sucesso!</b>"

      - name: Notificar erro
        if: ${{ failure() }}
        shell: bash
        run: |
          source /tmp/send_telegram_message.sh
          send_telegram_msg "❌ <b>[step 3/3] - Falha no build. Verifique os logs.</b>"
